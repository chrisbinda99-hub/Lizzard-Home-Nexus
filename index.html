    <script>
      // Suppress Vite HMR WebSocket connection errors as per AI Studio environment constraints
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('createWebSocketModuleRunnerTransport') || (e.filename && e.filename.includes('@vite/client')))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason).includes('WebSocket') || (e.reason.stack && e.reason.stack.includes('@vite/client')))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
